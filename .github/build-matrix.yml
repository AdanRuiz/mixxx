# Platforms built by .github/workflows/build.yml. The "Select platforms" job reads
# this list and keeps all of it, or only the entries whose artifacts_slug is listed
# in the `platforms` input (forks use it to build only what they need).
- name: Ubuntu 24.04
  os: ubuntu-24.04
  cmake_args: >-
    -DQT6=ON
    -DQML=ON
    -DBULK=ON
    -DFFMPEG=ON
    -DLOCALECOMPARE=ON
    -DMAD=ON
    -DMODPLUG=ON
    -DWAVPACK=ON
    -DINSTALL_USER_UDEV_RULES=OFF
  ctest_args: []
  compiler_cache: ccache
  compiler_cache_path: /home/runner/.cache/ccache
  compiler_cache_id: qt6
  cpack_generator: DEB
  buildenv_basepath: /home/runner/buildenv
  buildenv_script: tools/debian_buildenv.sh
  artifacts_name: Ubuntu 24.04 Qt6 DEB
  artifacts_path: build/*.deb
  artifacts_slug: ubuntu-jammy
- name: macOS 15 x64
  os: macos-15-intel
  cmake_args: >-
    -DBULK=ON
    -DCOREAUDIO=ON
    -DHSS1394=ON
    -DMACOS_BUNDLE=ON
    -DMODPLUG=ON
    -DQT6=ON
    -DQML=OFF
    -DWAVPACK=ON
    -DVCPKG_TARGET_TRIPLET=x64-osx-min1100-release
  # TODO: Fix this broken test on macOS
  ctest_args: []
  cpack_generator: DragNDrop
  compiler_cache: ccache
  compiler_cache_path: /Users/runner/Library/Caches/ccache
  compiler_cache_id: x64
  buildenv_basepath: /Users/runner/buildenv
  buildenv_script: tools/macos_release_buildenv.sh
  artifacts_name: macOS Intel DMG
  artifacts_path: build/*.dmg
  artifacts_slug: macos-macosintel
- name: macOS 15 arm64
  os: macos-15-intel
  cmake_args: >-
    -DBULK=ON
    -DCOREAUDIO=ON
    -DHSS1394=ON
    -DMACOS_BUNDLE=ON
    -DMODPLUG=ON
    -DQT6=ON
    -DQML=ON
    -DWAVPACK=ON
    -DVCPKG_TARGET_TRIPLET=arm64-osx-min1100-release
  # TODO: Fix this broken test on macOS
  crosscompile: true
  cpack_generator: DragNDrop
  compiler_cache: ccache
  compiler_cache_path: /Users/runner/Library/Caches/ccache
  compiler_cache_id: arm64
  buildenv_basepath: /Users/runner/buildenv
  buildenv_script: tools/macos_arm64-cross-release_buildenv.sh
  artifacts_name: macOS ARM DMG
  artifacts_path: build/*.dmg
  artifacts_slug: macos-macosarm
- name: Windows Server 2025 VS2026 x64
  os: windows-2025-vs2026
  # Attention: If you change the cmake_args for the Windows CI build,
  #            also adjust the for the local Windows build setup in
  #            ./tools/windows_buildenv.bat
  cmake_args: >-
    -DBULK=ON
    -DHSS1394=ON
    -DLOCALECOMPARE=ON
    -DMAD=ON
    -DMEDIAFOUNDATION=ON
    -DMODPLUG=ON
    -DQT6=ON
    -DQML=ON
    -DWAVPACK=ON
    -DVCPKG_TARGET_TRIPLET=x64-windows-release
  cc: cl
  cxx: cl
  # TODO: Fix these broken tests on Windows
  ctest_args: []
  cpack_generator: WIX
  buildenv_basepath: C:\buildenv
  buildenv_script: tools/windows_buildenv.bat
  artifacts_name: Windows x64 Installer
  artifacts_path: build/*.msi
  artifacts_slug: windows-win64
  arch: x64
- name: Windows 11 VS2026 ARM64
  os: windows-11-vs2026-arm
  # Attention: If you change the cmake_args for the Windows CI build,
  #            also adjust the for the local Windows build setup in
  #            ./tools/windows_buildenv.bat
  cmake_args: >-
    -DBULK=ON
    -DHSS1394=ON
    -DLOCALECOMPARE=ON
    -DMAD=ON
    -DMEDIAFOUNDATION=ON
    -DMODPLUG=ON
    -DQT6=ON
    -DQML=ON
    -DWAVPACK=ON
    -DVCPKG_TARGET_TRIPLET=arm64-windows-release
    -DVCPKG_DEFAULT_HOST_TRIPLET=arm64-windows-release
  cc: cl
  cxx: cl
  # TODO: Fix these broken tests on Windows
  ctest_args: --exclude-regex '^AutoDJProcessorTest.*$'
  cpack_generator: WIX
  buildenv_basepath: C:\buildenv
  buildenv_script: tools/windows_buildenv.bat
  artifacts_name: Windows ARM64 Installer
  artifacts_path: build/*.msi
  artifacts_slug: windows-winarm
  arch: arm64
- name: Android 15 arm64
  os: ubuntu-24.04
  # DBUILD_TESTING=OFF: error: OpenMP support and version of OpenMP (31, 40 or 45) differs
  cmake_args: >-
    -DBULK=ON
    -DQT6=ON
    -DQML=ON
    -DHID=ON
    -DVCPKG_TARGET_TRIPLET=arm64-android
    -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release
    -DCMAKE_SYSTEM_NAME=Android
    -DBUILD_TESTING=OFF
    -DBUILD_BENCH=OFF
  buildenv_basepath: /home/runner/buildenv
  buildenv_script: tools/android_buildenv.sh
  artifacts_name: Android 15 APK
  artifacts_path: build/android-build/build/outputs/apk/release/*.apk
  artifacts_slug: android-15
  compiler_cache: ccache
  compiler_cache_path: /home/runner/.cache/ccache
  crosscompile: true
  arch: arm64
# Ubuntu 22.04 (glibc 2.35) is the lowest viable glibc baseline: the
# AppImage must run on as many distributions as possible. Qt 6.11
# requires glibc >= 2.34, and the buildenv itself is built on 22.04.
# CMake >= 4.2 is provided by the "[AppImage] Set up cmake" step below.
- name: AppImage Linux x86_64
  os: ubuntu-22.04
  cmake_args: >-
    -DQT6=ON
    -DQML=ON
    -DMIXXX_APPIMAGE=ON
    -DINSTALL_USER_UDEV_RULES=OFF
    -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG"
    -DCMAKE_INSTALL_PREFIX=/usr
    -DCMAKE_INSTALL_LIBDIR=lib
    -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined"
  ctest_args: []
  cpack_generator: AppImage
  # Not a cross-compile: this is a native x86_64 build, so the
  # shared Test step must run.  The PPA steps are excluded for the
  # AppImage separately below.
  crosscompile: false
  compiler_cache: ccache
  compiler_cache_path: /home/runner/.cache/ccache
  compiler_cache_id: appimage-qt6
  buildenv_basepath: /home/runner/buildenv
  buildenv_script: tools/appimage_release_buildenv.sh
  artifacts_name: AppImage Linux x86_64
  artifacts_path: build/*.AppImage
  artifacts_slug: linux-appimage
  arch: x86_64
